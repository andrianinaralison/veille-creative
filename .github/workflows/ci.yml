name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]

jobs:
  guard-frontend:
    name: Frontend — pas d'URL API en dur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toute URL backend doit passer par lib/api.js ou lib/admin-api.js (VITE_API_URL).
      # Un localhost:3001 ailleurs = fetch non authentifié ou déploiement cassé (180-57).
      - name: Aucun localhost:3001 hors src/lib
        run: |
          if grep -rn "localhost:3001" veille-creative/src --exclude-dir=lib; then
            echo "::error::URL API en dur détectée hors de src/lib — utiliser api.* (lib/api.js)"
            exit 1
          fi

  test-backend:
    name: Backend — Vitest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: server

      - name: Run tests
        run: npm test
        working-directory: server
        env:
          JWT_SECRET: ci-secret-not-used-in-prod-32chars-min
          ADMIN_PASSWORD_HASH: $2b$12$QujJm4G7WhwA9sO/25y3NuGiM//Y/QrvUuRvteDANuZ9ecV.W7iGm
          ANTHROPIC_API_KEY: ci-placeholder
          DATABASE_URL: postgresql://ci:ci@localhost/ci
          YOUTUBE_API_KEY: ci-placeholder
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_SERVICE_KEY: ci-placeholder-service-key
